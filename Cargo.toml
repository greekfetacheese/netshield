[workspace]
resolver = "3"
members = ["crates/netshield-core", "crates/netshield-daemon", "crates/netshield-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
netshield-core = { path = "crates/netshield-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
log = "0.4"
redb = "4"

# The profile the README installs from.
[profile.prod]
inherits = "release"
codegen-units = 1
incremental = true
strip = true
# Slightly smaller binary size than level 3 and most of the times better perf
opt-level = 2
debug = false
lto = "fat"

