[workspace]
resolver = "3"
members = ["crates/netshield-core", "crates/netshield-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
netshield-core = { path = "crates/netshield-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
log = "0.4"
